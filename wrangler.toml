name = "sheytoon-deal-agent"
main = "src/worker.js"
compatibility_date = "2026-10-24"

# Check deal feeds every minute
[triggers]
crons = ["* * * * *"]

# Storage for users and seen deals.
# Create it with:  npx wrangler kv namespace create DB   and paste the id below.
[[kv_namespaces]]
binding = "DB"
id = "<your-kv-namespace-id>"

[observability]
enabled = true

# Secrets (never put them in this file):
#   npx wrangler secret put TELEGRAM_TOKEN
#   npx wrangler secret put OWNER_ID
