name: Deal Agent

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay it a little)
  workflow_dispatch:          # lets you run it by hand with the "Run workflow" button

permissions:
  contents: write             # needed to save keywords and seen deals

concurrency:
  group: deal-agent
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install feedparser requests

      - name: Run the agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deal_agent.py

      - name: Save keywords and seen deals
        run: |
          git config user.name "deal-agent-bot"
          git config user.email "deal-agent-bot@users.noreply.github.com"
          git add state.json keywords.txt exclude.txt
          git diff --cached --quiet || (git commit -m "Update deal agent state" && git push)
